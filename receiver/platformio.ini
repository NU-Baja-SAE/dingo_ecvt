; Firmware for the ESP32 that receives ECVT telemetry over ESP-NOW and
; prints it over USB serial as KEY=VALUE lines for serial_plotter.py. Its WiFi MAC must match ESPNOW_PEER_MAC
; in include/config.h. Build/upload with:
;   pio run -d receiver -t upload

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -I../include
