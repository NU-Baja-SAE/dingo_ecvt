; DISABLED: the ECVT now sends telemetry over ESP-NOW. To use this logger
; again, set SD_LOG_ENABLE to 1 in include/config.h.
;
; Firmware for the ESP32-CAM that receives ECVT telemetry over UART
; and writes it to the onboard SD card. Build/upload with:
;   pio run -d sd_logger -t upload

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
